<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guitar Virtuoso — 기타 코드 튜터</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#23201A">
  <meta name="description" content="Guitar Virtuoso — chord library, practice drills, tuner, and ear training. 마이크로 코드를 확인해 주는 기타 연습 앱.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Guitar Virtuoso</h1>
  <nav class="tabs">
    <button class="tab active" data-tab="library"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4.5 2v12M8 2v12M11.5 2v12M2 4.5h12M2 8h12M2 11.5h12"/></g><circle cx="8" cy="8" r="1.6" fill="currentColor"/></svg><span data-i18n="tab.library">라이브러리</span></button>
    <button class="tab" data-tab="practice"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="5.6"/><circle cx="8" cy="8" r="2.4"/></g><circle cx="8" cy="8" r=".9" fill="currentColor"/></svg><span data-i18n="tab.practice">연습</span></button>
    <button class="tab" data-tab="tuner"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.8 12.5a6 6 0 0 1 10.4 0"/><path d="M8 12.5l2.6-4.2"/><circle cx="8" cy="12.5" r="1"/></g></svg><span data-i18n="tab.tuner">튜너</span></button>
    <button class="tab" data-tab="ear"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M8 3v10M4.8 5.5v5M11.2 5.5v5M2 7v2M14 7v2"/></g></svg><span data-i18n="tab.ear">청음</span></button>
    <button class="tab" data-tab="fretboard"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 5h12M2 8h12M2 11h12M5.8 3v10M10.2 3v10"/></g><circle cx="8" cy="6.5" r="1.7" fill="currentColor"/></svg><span data-i18n="tab.fretboard">지판</span></button>
    <button class="tab" data-tab="strum"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5V4.5M3.4 10.6 5 12.7l1.6-2.1M11 3.5v8M9.4 5.5 11 3.4l1.6 2.1"/></g></svg><span data-i18n="tab.strum">스트럼</span></button>
    <button class="tab" data-tab="songs"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.3V3.8l6-1.6v8.4"/><path d="M6 6.6l6-1.6"/></g><circle cx="4.2" cy="12.3" r="1.8" fill="currentColor"/><circle cx="10.2" cy="10.6" r="1.8" fill="currentColor"/></svg><span data-i18n="tab.songs">노래</span></button>
    <button class="tab" data-tab="stats"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3.5 13V8.5M8 13V4M12.5 13V9.5M2 14.5h12"/></g></svg><span data-i18n="tab.stats">기록</span></button>
  </nav>
  <button id="settingsBtn" class="tab settings-gear" data-tab="settings" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false">
      <g fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="8" cy="8" r="5.4"/>
        <circle cx="8" cy="8" r="2.1"/>
        <path d="M8 .6v2M8 13.4v2M.6 8h2M13.4 8h2M2.7 2.7l1.5 1.5M11.8 11.8l1.5 1.5M13.3 2.7l-1.5 1.5M4.2 11.8l-1.5 1.5"/>
      </g>
    </svg>
  </button>
</header>

<main>
  <!-- ============ LIBRARY ============ -->
  <section id="screen-library" class="screen active">
    <div class="picker">
      <div id="rootChips" class="chip-row"></div>
      <div id="qualityChips" class="picker-groups"></div>
      <div id="bassChips" class="chip-row"></div>
    </div>
    <div class="library-body">
      <div class="chord-panel">
        <h2 id="chordTitle" class="chord-title">C</h2>
        <div id="chordDiagram" class="chord-diagram"></div>
        <div class="voicing-pager">
          <button id="voicingPrev" class="ghost">◀</button>
          <span id="voicingInfo">1/1</span>
          <button id="voicingNext" class="ghost">▶</button>
        </div>
        <div class="row">
          <button id="playChord" class="primary" data-i18n="lib.play">▶ 듣기</button>
          <button id="addToDeck" class="ghost" data-i18n="lib.addDeck">덱에 추가</button>
        </div>
      </div>
      <div class="board-panel">
        <div id="libraryBoard" class="board"></div>
        <p id="voicingNotes" class="notes-line"></p>
      </div>
    </div>
  </section>

  <!-- ============ PRACTICE ============ -->
  <section id="screen-practice" class="screen">
    <div id="practiceSetup" class="setup-card">
      <div class="chip-row">
        <span class="row-label" data-i18n="pr.mode">모드</span>
        <span class="seg">
          <button class="chip sel" data-pmode="flash" data-i18n="pr.flash">플래시카드</button>
          <button class="chip" data-pmode="prog" data-i18n="pr.prog">진행 연습</button>
        </span>
      </div>
      <div class="chip-row">
        <span class="row-label" data-i18n="pr.input">입력</span>
        <span class="seg">
          <button class="chip sel" data-input="mic" data-i18n="pr.mic">마이크</button>
          <button class="chip" data-input="virtual" data-i18n="pr.virtual">가상 지판</button>
        </span>
      </div>
      <div id="flashOpts">
        <div class="chip-row">
          <span class="row-label" data-i18n="pr.deck">덱</span>
          <span class="seg">
            <button class="chip sel" data-deck="starter8" data-i18n="pr.starter8">입문 8</button>
            <button class="chip" data-deck="open15" data-i18n="pr.open15">오픈 15</button>
            <button class="chip" data-deck="custom" data-i18n="pr.custom">내 덱</button>
            <button class="chip" data-deck="weak" data-i18n="pr.weak">취약 코드</button>
          </span>
        </div>
      </div>
      <div id="progOpts" hidden>
        <div class="chip-row">
          <input id="progSearch" type="search" class="gt-search">
        </div>
        <div class="chip-row">
          <span class="row-label" data-i18n="pr.progSel">진행</span>
          <select id="progChips" class="gt-select"></select>
        </div>
        <div class="chip-row">
          <span class="row-label" data-i18n="pr.key">키</span>
          <span id="keyChips" class="chip-row wrap"></span>
        </div>
        <div class="chip-row bpm-row">
          <span class="row-label">BPM</span>
          <button id="bpmDown" class="chip bpm-step" aria-label="BPM down">−</button>
          <input id="bpm" type="range" min="40" max="160" value="72">
          <button id="bpmUp" class="chip bpm-step" aria-label="BPM up">+</button>
          <span id="bpmVal" class="mono">72</span>
        </div>
        <div id="customProg"></div>
      </div>
      <button id="startSession" class="primary big" data-i18n="pr.start">시작</button>
    </div>

    <div id="practiceRun" hidden>
      <div class="run-top">
        <span id="runProgress" class="mono"></span>
        <span id="runScore" class="mono"></span>
        <button id="endSession" class="ghost" data-i18n="pr.end">끝내기</button>
      </div>
      <div class="run-bar" aria-hidden="true"><i></i></div>
      <div class="run-body">
        <h2 id="targetChord" class="chord-title huge"></h2>
        <div id="runDiagram" class="chord-diagram"></div>
        <div id="runFeedback" class="feedback"></div>
        <div id="runHeard" class="heard"></div>
        <div id="virtualBoard" class="board" hidden></div>
        <div class="row">
          <button id="hearTarget" class="ghost" data-i18n="pr.hear">소리 듣기</button>
          <button id="skipChord" class="ghost" data-i18n="pr.skip">건너뛰기</button>
          <button id="submitVirtual" class="primary" hidden data-i18n="pr.check">확인</button>
        </div>
      </div>
    </div>

    <div id="practiceResult" hidden>
      <h2 data-i18n="pr.results">결과</h2>
      <div id="resultBody"></div>
      <button id="againBtn" class="primary" data-i18n="pr.again">다시 하기</button>
    </div>
  </section>

  <!-- ============ TUNER ============ -->
  <section id="screen-tuner" class="screen">
    <div id="tunerGauge" class="gauge"></div>
    <div class="tuner-readout">
      <span id="tunerNote" class="note-name">—</span>
      <span id="tunerCents" class="mono cents"></span>
      <span id="tunerFreq" class="mono freq"></span>
    </div>
    <div id="stringBtns" class="chip-row center"></div>
    <div class="level-wrap"><div id="tunerLevel" class="level-bar"></div></div>
    <button id="tunerMicBtn" class="primary big" data-i18n="tu.start">마이크 시작</button>
    <p id="tunerHint" class="hint" data-i18n="tu.hint">줄을 하나씩 튕기며 바늘을 가운데로 맞추세요.</p>
  </section>

  <!-- ============ EAR TRAINING ============ -->
  <section id="screen-ear" class="screen">
    <div id="earBody"></div>
  </section>

  <!-- ============ FRETBOARD GAME ============ -->
  <section id="screen-fretboard" class="screen">
    <div id="fretBody"></div>
  </section>

  <!-- ============ STRUM PATTERNS ============ -->
  <section id="screen-strum" class="screen">
    <div id="strumBody"></div>
  </section>

  <!-- ============ SONGS ============ -->
  <section id="screen-songs" class="screen">
    <div id="songsBody"></div>
  </section>

  <!-- ============ STATS ============ -->
  <section id="screen-stats" class="screen">
    <div id="statsBody"></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section id="screen-settings" class="screen">
    <div id="settingsBody"></div>
  </section>
</main>

<div id="micBanner" class="banner" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
