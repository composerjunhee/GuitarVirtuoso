<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2720"/>
      <stop offset="100%" stop-color="#23201a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- mini chord diagram: 6 strings, 4 frets, an E-major-ish shape -->
  <g stroke="#a89b84" stroke-width="1.8" stroke-linecap="round">
    <line x1="26" y1="32" x2="26" y2="78"/>
    <line x1="36" y1="32" x2="36" y2="78"/>
    <line x1="46" y1="32" x2="46" y2="78"/>
    <line x1="56" y1="32" x2="56" y2="78"/>
    <line x1="66" y1="32" x2="66" y2="78"/>
    <line x1="76" y1="32" x2="76" y2="78"/>
  </g>
  <g stroke="#6a5f4c" stroke-width="2">
    <line x1="26" y1="47.3" x2="76" y2="47.3"/>
    <line x1="26" y1="62.7" x2="76" y2="62.7"/>
    <line x1="26" y1="78" x2="76" y2="78"/>
  </g>
  <!-- nut bar -->
  <rect x="24.5" y="28.5" width="53" height="6" rx="2" fill="#ece4d4"/>
  <!-- E-shape dots with a dark rim -->
  <g fill="#e8a33d" stroke="#1d1a14" stroke-width="1.2">
    <circle cx="36" cy="55" r="6.5"/>
    <circle cx="46" cy="55" r="6.5"/>
    <circle cx="56" cy="39.7" r="6.5"/>
  </g>
</svg>
